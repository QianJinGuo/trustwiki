name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
      - name: dogfood — starter vault must lint clean
        run: node cli/bin.js lint templates/starter-vault
      - name: dogfood — repo's own docs pass their self-lint
        run: node cli/bin.js lint .

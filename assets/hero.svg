<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="trustwiki — knowledge bases your agent can maintain, without lying to you">
  <rect width="1200" height="300" fill="#07070c"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#262636"/>

  <!-- wordmark -->
  <text x="70" y="122" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="56" font-weight="700" fill="#eceef4">trust<tspan fill="#6366f1">wiki</tspan></text>

  <!-- tagline -->
  <text x="70" y="170" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',Helvetica,Arial,sans-serif" font-size="21" fill="#8b8ba3">Knowledge bases your agent can maintain — without lying to you.</text>

  <!-- three value pills -->
  <circle cx="78" cy="216" r="4" fill="#22d3ee"/>
  <text x="92" y="221" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#22d3ee">every claim cited</text>
  <circle cx="288" cy="216" r="4" fill="#fbbf24"/>
  <text x="302" y="221" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#fbbf24">contradictions surfaced</text>
  <circle cx="556" cy="216" r="4" fill="#34d399"/>
  <text x="570" y="221" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#34d399">rot detected</text>

  <!-- install hint -->
  <text x="70" y="262" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#5d5d75">$ npx trustwiki lint ./your-vault</text>

  <!-- right motif: a real report card -->
  <rect x="740" y="45" width="400" height="212" rx="12" fill="#10101a" stroke="#262636"/>
  <text x="764" y="80" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#8b8ba3">notes/sloppy-page.md</text>
  <text x="764" y="112" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" xml:space="preserve"><tspan fill="#5d5d75">L12 </tspan><tspan fill="#f87171">error</tspan><tspan fill="#8b8ba3"> citation.target-missing</tspan></text>
  <text x="764" y="138" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" xml:space="preserve"><tspan fill="#5d5d75">L14 </tspan><tspan fill="#fbbf24">warn </tspan><tspan fill="#8b8ba3"> provenance.excess-inferred</tspan></text>
  <text x="764" y="164" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" xml:space="preserve"><tspan fill="#5d5d75">L16 </tspan><tspan fill="#fbbf24">warn </tspan><tspan fill="#8b8ba3"> placeholder.present</tspan></text>
  <text x="764" y="190" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" xml:space="preserve"><tspan fill="#5d5d75">L18 </tspan><tspan fill="#f87171">error</tspan><tspan fill="#8b8ba3"> link.broken</tspan></text>
  <text x="764" y="228" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#eceef4">Σ 3 errors, 6 warnings <tspan fill="#34d399">— all traceable</tspan></text>
</svg>
